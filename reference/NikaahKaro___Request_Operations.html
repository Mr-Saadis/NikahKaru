b.classList.add("ld");b.querySelector("span").textContent="Finding matches…";setTimeout(()=>{if(selId!==c.id)return;mon[c.id]=true;b.classList.remove("ld");b.querySelector("span").textContent="Hide Matches";renderMatches();const t=$("mt");SC.scrollTo({top:t.getBoundingClientRect().top-SC.getBoundingClientRect().top+SC.scrollTop-74,behavior:"smooth"})},750)};
$("lb").onclick=()=>{c.later=!c.later;render();toast(c.later?"Moved to Respond Later":"Returned to board")};$("cl").onclick=closeSheet;updBtn();renderMatches();requestAnimationFrame(spy)}
function openSheet(id){closeMP();selId=id;fill();document.querySelectorAll(".card").forEach(e=>e.classList.toggle("sel",+e.dataset.id===id));
if(!SH.classList.contains("open")){setH(bounds()[0],true);SH.setAttribute("aria-hidden","false");requestAnimationFrame(()=>SH.classList.add("open"))}}
function closeSheet(){if(selId===null)return;closeMP();selId=null;SH.classList.remove("open");SH.setAttribute("aria-hidden","true");$("board").style.paddingBottom="";$("board").classList.remove("lock");document.querySelectorAll(".card.sel").forEach(e=>e.classList.remove("sel"))}
$("sx").onclick=closeSheet;
function grow(dy,e){const[min,max]=bounds();if(dy>0&&sh<max-1){e.cancelable&&e.preventDefault();setH(Math.min(max,sh+dy),false);return 1}
if(dy<0&&SC.scrollTop<=0&&sh>min+1){e.cancelable&&e.preventDefault();setH(Math.max(min,sh+dy),false);return 1}return 0}
SH.addEventListener("wheel",e=>{grow(e.deltaY,e)},{passive:false});
let ty=0;SH.addEventListener("touchstart",e=>{ty=e.touches[0].clientY},{passive:true});
SH.addEventListener("touchmove",e=>{const y=e.touches[0].clientY;grow(ty-y,e);ty=y},{passive:false});
let dg=null;SH.addEventListener("pointerdown",e=>{if(!e.target.closest(".grab,.hero")||e.target.closest("button"))return;dg={y:e.clientY,h:sh};SH.classList.add("drag");e.preventDefault()});
addEventListener("pointermove",e=>{if(!dg)return;const[min,max]=bounds(),H=SH.parentElement.clientHeight;setH(Math.max(H*.25,Math.min(max,dg.h+dg.y-e.clientY)),false)});
addEventListener("pointerup",()=>{if(!dg)return;dg=null;const[min,max]=bounds();if(sh<min*.72)return closeSheet();setH(sh>(min+max)/2?max:min,true)});
addEventListener("resize",()=>{if(selId!==null){const[min,max]=bounds();setH(Math.max(min,Math.min(max,sh)),true)}});
const closeAll=()=>document.querySelectorAll(".ex").forEach(p=>p.classList.remove("open"));
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=e=>{e.stopPropagation();const p=$(b.dataset.p),o=p.classList.contains("open");closeAll();if(!o){p.classList.add("open");const i=p.querySelector("input");if(i)setTimeout(()=>i.focus(),180)}});
document.addEventListener("click",e=>{if(!e.target.closest(".fw"))closeAll()});
$("stsel").onchange=e=>{sel.value=e.target.value;render()};document.addEventListener("keydown",e=>{if(e.key==="Escape"){document.querySelector(".ex.open")?closeAll():$("mp").classList.contains("open")?closeMP():closeSheet()}});
render();
</script></body></html>
